<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure Type Classifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="data.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .image-card { transition: all 0.2s; }
        .image-card.selected-intro { border: 3px solid #3b82f6; background-color: #eff6ff; }
        .image-card.selected-method { border: 3px solid #10b981; background-color: #ecfdf5; }
        .image-card.selected-na { border: 3px solid #94a3b8; opacity: 0.6; background-color: #f1f5f9; }
        
        /* Modal for zooming */
        .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.9); }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 90vh; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">

    <header class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shadow-sm z-10">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <span class="bg-indigo-600 text-white px-2 py-0.5 rounded text-sm">Pre-process</span>
                Figure Classifier
            </h1>
            <div class="h-6 w-px bg-slate-300"></div>
            <div class="text-sm text-slate-500">
                Paper: <span id="current-idx" class="font-bold text-slate-900">1</span> / <span id="total-count">10</span>
            </div>
            <div class="w-48 bg-slate-200 rounded-full h-2.5 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-500 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
        <div class="flex gap-3">
            <button onclick="exportData()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-bold text-sm shadow flex items-center gap-2 transition">
                💾 Download new_data.js
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <div class="w-80 bg-white border-r border-slate-200 overflow-y-auto hidden md:block" id="sidebar">
            </div>

        <div class="flex-1 overflow-y-auto p-8 relative" id="main-area">
            
            <div class="max-w-5xl mx-auto">
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-slate-900 leading-tight mb-2" id="paper-title">Paper Title</h2>
                    <p class="text-sm font-mono text-slate-500" id="paper-folder">folder_name</p>
                </div>

                <div id="image-grid" class="grid grid-cols-1 gap-12 pb-24">
                    </div>
            </div>

            <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-white/90 backdrop-blur border border-slate-200 shadow-2xl rounded-full px-6 py-3 flex items-center gap-4 z-20">
                <button onclick="prevPaper()" class="text-slate-500 hover:text-indigo-600 font-bold px-3 py-1">← Prev Paper</button>
                <div class="h-4 w-px bg-slate-300"></div>
                <span class="text-xs text-slate-400 font-mono">Use keys: [1] Intro, [2] Method, [3] N/A</span>
                <div class="h-4 w-px bg-slate-300"></div>
                <button onclick="nextPaper()" class="bg-slate-900 hover:bg-slate-800 text-white px-6 py-2 rounded-full font-bold shadow-lg transition">Next Paper →</button>
            </div>
        </div>
    </div>

    <div id="imgModal" class="modal" onclick="closeModal()">
        <span class="absolute top-4 right-8 text-white text-4xl font-bold cursor-pointer">&times;</span>
        <img class="modal-content" id="modalImg">
        <div id="modalCaption" class="text-center text-white mt-4 px-4 font-serif text-lg"></div>
    </div>

    <script>
        // --- STATE MANAGEMENT ---
        let currentPaperIdx = 0;
        // Key: "folderName/filename", Value: "intro" | "method" | "na"
        const classifications = {}; 

        // Initialize
        window.onload = () => {
            if (!window.PAPER_DATA) {
                alert("Error: window.PAPER_DATA not found. Make sure data.js is loaded.");
                return;
            }
            renderSidebar();
            loadPaper(0);
        };

        // --- RENDERING ---
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';
            
            window.PAPER_DATA.forEach((paper, idx) => {
                // Check if all images in this paper are classified
                const isDone = paper.images.every(img => classifications[`${paper.folder_name}/${img.filename}`]);
                
                const div = document.createElement('div');
                div.className = `p-4 border-b border-slate-100 cursor-pointer hover:bg-slate-50 transition ${idx === currentPaperIdx ? 'bg-indigo-50 border-l-4 border-l-indigo-600' : ''}`;
                div.onclick = () => loadPaper(idx);
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="text-xs font-mono text-slate-400">#${idx + 1}</span>
                        ${isDone ? '<span class="text-green-500 text-xs font-bold">✓</span>' : ''}
                    </div>
                    <p class="text-sm font-medium text-slate-700 line-clamp-2 mt-1 ${isDone ? 'text-slate-400' : ''}">${paper.title}</p>
                `;
                sidebar.appendChild(div);
            });
            
            // Update Progress Header
            document.getElementById('total-count').innerText = window.PAPER_DATA.length;
            document.getElementById('current-idx').innerText = currentPaperIdx + 1;
            
            // Calc total progress
            let totalImages = 0;
            let doneImages = 0;
            window.PAPER_DATA.forEach(p => {
                p.images.forEach(img => {
                    totalImages++;
                    if (classifications[`${p.folder_name}/${img.filename}`]) doneImages++;
                });
            });
            const pct = totalImages === 0 ? 0 : (doneImages / totalImages) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;
        }

        function loadPaper(idx) {
            currentPaperIdx = idx;
            const paper = window.PAPER_DATA[idx];
            
            document.getElementById('paper-title').innerText = paper.title;
            document.getElementById('paper-folder').innerText = paper.folder_name;

            const grid = document.getElementById('image-grid');
            grid.innerHTML = '';

            paper.images.forEach((img, imgIdx) => {
                const key = `${paper.folder_name}/${img.filename}`;
                const currentType = classifications[key];

                const card = document.createElement('div');
                card.id = `card-${imgIdx}`;
                card.className = `image-card bg-white rounded-xl border border-slate-200 shadow-sm p-6 flex flex-col md:flex-row gap-6 items-start ${getTypeClass(currentType)}`;
                
                card.innerHTML = `
                    <div class="w-full md:w-2/3 bg-slate-50 rounded-lg flex items-center justify-center p-2 border border-slate-100 cursor-zoom-in group" onclick="openModal('${img.path}', '${escapeHtml(img.caption)}')">
                        <img src="${img.path}" class="max-h-[500px] object-contain group-hover:scale-[1.01] transition-transform">
                    </div>
                    
                    <div class="w-full md:w-1/3 flex flex-col h-full">
                        <div class="bg-amber-50 p-4 rounded-lg border border-amber-100 mb-6">
                            <span class="text-[10px] font-bold text-amber-700 uppercase tracking-widest block mb-1">Figure Caption</span>
                            <p class="text-sm text-amber-900 font-serif italic leading-relaxed max-h-60 overflow-y-auto custom-scrollbar">${img.caption}</p>
                        </div>

                        <div class="mt-auto">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Classify Type</p>
                            <div class="space-y-3">
                                <button onclick="selectType('${key}', 'intro', ${imgIdx})" class="w-full flex items-center p-3 rounded-lg border-2 transition-all ${currentType === 'intro' ? 'border-blue-500 bg-blue-50 text-blue-700 font-bold' : 'border-slate-200 hover:border-slate-300 text-slate-600'}">
                                    <span class="w-6 h-6 rounded-full border-2 flex items-center justify-center mr-3 text-xs ${currentType === 'intro' ? 'border-blue-500 bg-blue-500 text-white' : 'border-slate-300'}">1</span>
                                    Intro / Overview
                                </button>
                                
                                <button onclick="selectType('${key}', 'method', ${imgIdx})" class="w-full flex items-center p-3 rounded-lg border-2 transition-all ${currentType === 'method' ? 'border-emerald-500 bg-emerald-50 text-emerald-700 font-bold' : 'border-slate-200 hover:border-slate-300 text-slate-600'}">
                                    <span class="w-6 h-6 rounded-full border-2 flex items-center justify-center mr-3 text-xs ${currentType === 'method' ? 'border-emerald-500 bg-emerald-500 text-white' : 'border-slate-300'}">2</span>
                                    Method / Architecture
                                </button>
                                
                                <button onclick="selectType('${key}', 'na', ${imgIdx})" class="w-full flex items-center p-3 rounded-lg border-2 transition-all ${currentType === 'na' ? 'border-slate-400 bg-slate-100 text-slate-500 font-bold' : 'border-slate-200 hover:border-slate-300 text-slate-600'}">
                                    <span class="w-6 h-6 rounded-full border-2 flex items-center justify-center mr-3 text-xs ${currentType === 'na' ? 'border-slate-500 bg-slate-500 text-white' : 'border-slate-300'}">3</span>
                                    N/A (Exclude)
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            renderSidebar(); // Update highlight
            
            // Scroll to top
            document.getElementById('main-area').scrollTop = 0;
        }

        // --- ACTIONS ---
        function selectType(key, type, imgIdx) {
            classifications[key] = type;
            
            // Update UI immediately without full reload
            const card = document.getElementById(`card-${imgIdx}`);
            
            // Remove old classes
            card.classList.remove('selected-intro', 'selected-method', 'selected-na');
            // Add new class
            if (type === 'intro') card.classList.add('selected-intro');
            if (type === 'method') card.classList.add('selected-method');
            if (type === 'na') card.classList.add('selected-na');

            // Update button styles inside this card
            const buttons = card.querySelectorAll('button[onclick^="selectType"]');
            buttons.forEach(btn => {
                // Reset to default
                btn.className = "w-full flex items-center p-3 rounded-lg border-2 transition-all border-slate-200 hover:border-slate-300 text-slate-600";
                btn.querySelector('span').className = "w-6 h-6 rounded-full border-2 flex items-center justify-center mr-3 text-xs border-slate-300";
                
                // Check if this is the clicked button
                if (btn.getAttribute('onclick').includes(`'${type}'`)) {
                    if (type === 'intro') {
                        btn.className = "w-full flex items-center p-3 rounded-lg border-2 transition-all border-blue-500 bg-blue-50 text-blue-700 font-bold";
                        btn.querySelector('span').className = "w-6 h-6 rounded-full border-2 flex items-center justify-center mr-3 text-xs border-blue-500 bg-blue-500 text-white";
                    } else if (type === 'method') {
                        btn.className = "w-full flex items-center p-3 rounded-lg border-2 transition-all border-emerald-500 bg-emerald-50 text-emerald-700 font-bold";
                        btn.querySelector('span').className = "w-6 h-6 rounded-full border-2 flex items-center justify-center mr-3 text-xs border-emerald-500 bg-emerald-500 text-white";
                    } else {
                        btn.className = "w-full flex items-center p-3 rounded-lg border-2 transition-all border-slate-400 bg-slate-100 text-slate-500 font-bold";
                        btn.querySelector('span').className = "w-6 h-6 rounded-full border-2 flex items-center justify-center mr-3 text-xs border-slate-500 bg-slate-500 text-white";
                    }
                }
            });

            renderSidebar(); // Update progress bar & sidebar checkmarks
        }

        function getTypeClass(type) {
            if (type === 'intro') return 'selected-intro';
            if (type === 'method') return 'selected-method';
            if (type === 'na') return 'selected-na';
            return '';
        }

        function prevPaper() {
            if (currentPaperIdx > 0) loadPaper(currentPaperIdx - 1);
        }

        function nextPaper() {
            if (currentPaperIdx < window.PAPER_DATA.length - 1) {
                loadPaper(currentPaperIdx + 1);
            } else {
                alert("This is the last paper! Please download the JSON.");
            }
        }

        // --- KEYBOARD SHORTCUTS ---
        document.addEventListener('keydown', (e) => {
            // Find the first visible image card that hasn't been classified (optional heuristic)
            // Or just apply to the image currently in viewport? 
            // For simplicity, let's just say keys 1,2,3 apply to the *first unclassified* image in the current view, 
            // or if all classified, the first one?
            // Actually, manual clicking is safer. But let's support hover-based shortcut? 
            // No, that's complicated.
            // Let's just Map keys 1,2,3 to the specific button if user is scrolling.
            // Simplified: If you press 'Shift+Enter', go next paper.
            if (e.shiftKey && e.key === 'Enter') {
                nextPaper();
            }
        });

        // --- EXPORT ---
        function exportData() {
            // Create deep copy of data
            const newData = JSON.parse(JSON.stringify(window.PAPER_DATA));
            
            let missingCount = 0;

            newData.forEach(paper => {
                paper.images.forEach(img => {
                    const key = `${paper.folder_name}/${img.filename}`;
                    if (classifications[key]) {
                        img.type = classifications[key];
                    } else {
                        img.type = "method"; // Default fallback? Or alert?
                        missingCount++;
                    }
                });
            });

            if (missingCount > 0) {
                if (!confirm(`Warning: ${missingCount} images have not been classified yet. They will default to 'method'. Continue?`)) {
                    return;
                }
            }

            const fileContent = "window.PAPER_DATA = " + JSON.stringify(newData, null, 2) + ";";
            const blob = new Blob([fileContent], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = 'new_data.js';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- UTILS ---
        function escapeHtml(text) {
            if (!text) return "";
            return text.replace(/'/g, "&apos;").replace(/"/g, "&quot;");
        }

        function openModal(src, caption) {
            const modal = document.getElementById('imgModal');
            const modalImg = document.getElementById('modalImg');
            const modalCaption = document.getElementById('modalCaption');
            modal.style.display = "flex";
            modalImg.src = src;
            modalCaption.innerText = caption.replace(/&apos;/g, "'").replace(/&quot;/g, '"');
        }

        function closeModal() {
            document.getElementById('imgModal').style.display = "none";
        }
    </script>
</body>
</html>
